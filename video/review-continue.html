<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Continue to video review | SATCOM</title><link rel="stylesheet" href="/video/player.css"><style>body{padding:30px 20px}main{max-width:560px;margin:auto}.card{border:1px solid var(--line);border-radius:8px;padding:24px;background:var(--panel)}p{color:var(--muted)}button{background:var(--accent);border:0;color:var(--bg);border-radius:4px;padding:12px 18px;font-weight:700;cursor:pointer}#error{color:#e8b45f}</style></head><body><main>
<nav><a href="/video">← Video network</a></nav>
<p class="eyebrow">SECURE REVIEW LINK</p>
<h1>Continue to review</h1>
<div class="card">
<p>Tap continue on this phone to open the SATCOM video review page. Previewing this link does not use it.</p>
<p id="error" hidden>This review link is invalid, expired, or already used. Ask for a new text.</p>
<form id="continue" method="post" action="/api/video-review-session">
<input type="hidden" name="token" id="token">
<button type="submit">Continue to review</button>
</form>
</div>
</main>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
document.getElementById('token').value = token;
if (params.get('error') === 'invalid' || !token) document.getElementById('error').hidden = false;
if (!token) document.getElementById('continue').hidden = true;
</script>
</body></html>
