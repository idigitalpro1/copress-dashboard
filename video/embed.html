<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Paul Hill video | Colorado News Press</title><link rel="stylesheet" href="/video/player.css"><script type="module" src="/video/player.js"></script></head>
<body><main class="channel" aria-label="Colorado News Press video carousel" aria-roledescription="carousel">
  <header><div><p class="eyebrow">COLORADO NEWS PRESS · VIDEO NETWORK</p><h1 id="channel-title">On location with Paul Hill</h1></div><span class="network-mark" aria-hidden="true">5280</span></header>
  <div id="feed-message" role="status">Loading the latest videos…</div>
  <section id="viewer" hidden aria-label="Selected video">
    <div class="screen" id="screen"><div id="media"></div><button id="play" class="play" type="button" aria-label="Play selected video"><span aria-hidden="true">▶</span><span>Watch video</span></button><div class="screen-shade"></div><span id="badge" class="badge"></span></div>
    <div class="story"><div><p id="credit" class="credit"></p><h2 id="title"></h2><p id="description"></p></div><div class="transport"><button type="button" id="previous" aria-label="Previous video">←</button><span id="position" aria-live="polite"></span><button type="button" id="next" aria-label="Next video">→</button></div></div>
    <div class="playlist-heading"><span>More from the field</span><button type="button" id="rotation" aria-pressed="false">Pause slideshow</button></div>
    <div id="playlist" class="playlist" aria-label="Choose a video"></div>
  </section>
  <footer><span>Independent reporting. Across Colorado.</span><span id="freshness"></span></footer>
</main></body></html>
